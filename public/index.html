<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow Library</title>
<style>
:root{
  --bg-900:#121618;
  --bg-800:#1A1E20;
  --bg-700:#23282B;
  --bg-600:#2E3539;
  --ink:#FFFFFF;
  --ink-mute:#9BA6AB;
  --ink-dim:#6B7579;
  --accent:#7C6BF0;
  --accent-dim:rgba(124,107,240,.18);
  --border:rgba(255,255,255,.08);
  --sidebar-w:280px;
  --topbar-h:48px;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;padding:0;background:var(--bg-900);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
button{font-family:inherit;cursor:pointer;}

.app{display:flex;flex-direction:column;height:100%;overflow:hidden;}

/* ── Top bar ── */
.topbar{
  height:var(--topbar-h);flex:none;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px 0 12px;
  background:linear-gradient(180deg,rgba(18,22,24,.98),rgba(18,22,24,.92));
  border-bottom:1px solid var(--border);
  z-index:20;
}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0;}
.menu-btn{
  appearance:none;border:none;background:var(--bg-700);
  color:var(--ink-mute);width:34px;height:34px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,color .2s;
}
.menu-btn:hover{background:var(--bg-600);color:var(--ink);}
.menu-btn svg{width:18px;height:18px;}
.brand{display:flex;flex-direction:column;min-width:0;}
.brand-title{font-size:14px;font-weight:700;letter-spacing:-.01em;line-height:1.2;}
.brand-sub{font-size:10.5px;color:var(--ink-dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.count-badge{
  font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-dim);
  padding:5px 10px;border-radius:20px;white-space:nowrap;
}

/* ── Body layout ── */
.body{display:flex;flex:1;min-height:0;position:relative;}

/* ── Sidebar ── */
.sidebar{
  width:var(--sidebar-w);flex:none;
  background:var(--bg-800);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  transition:width .28s var(--ease),border-color .28s var(--ease),opacity .22s var(--ease);
  overflow:hidden;z-index:15;
}
.sidebar.collapsed{
  width:0;min-width:0;
  border-right-color:transparent;
  opacity:0;
  pointer-events:none;
}
.sidebar-head{
  padding:18px 16px 12px;
  border-bottom:1px solid var(--border);
  white-space:nowrap;
  min-width:var(--sidebar-w);
}
.sidebar-label{
  font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-dim);
}
.sidebar-count{
  margin-top:4px;font-size:12px;color:var(--ink-mute);
}

.workflow-list{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:10px 8px 16px;
  min-width:var(--sidebar-w);
  scrollbar-width:thin;scrollbar-color:var(--bg-600) transparent;
}
.workflow-list::-webkit-scrollbar{width:5px;}
.workflow-list::-webkit-scrollbar-thumb{background:var(--bg-600);border-radius:3px;}

.wf-card{
  appearance:none;border:none;width:100%;text-align:left;
  background:transparent;color:inherit;
  border-radius:10px;padding:0;margin-bottom:6px;
  cursor:pointer;position:relative;
  transition:background .2s,transform .15s;
}
.wf-card:hover{background:rgba(255,255,255,.04);}
.wf-card.active{background:rgba(255,255,255,.06);}
.wf-card-inner{
  display:flex;gap:0;overflow:hidden;border-radius:10px;
  border:1px solid transparent;
  transition:border-color .2s;
}
.wf-card.active .wf-card-inner{border-color:rgba(255,255,255,.1);}
.wf-accent{width:4px;flex:none;border-radius:10px 0 0 10px;}
.wf-body{padding:12px 14px 12px 12px;min-width:0;flex:1;}
.wf-title{font-size:13px;font-weight:600;line-height:1.25;color:var(--ink);}
.wf-sub{font-size:11px;color:var(--ink-mute);margin-top:3px;line-height:1.35;}
.wf-client{font-size:10px;color:var(--ink-dim);margin-top:5px;}
.wf-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.wf-tag{
  font-size:9px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  padding:3px 7px;border-radius:4px;
  background:rgba(255,255,255,.05);color:var(--ink-mute);
}

.sidebar-foot{
  padding:12px 16px;border-top:1px solid var(--border);
  font-size:10px;color:var(--ink-dim);line-height:1.45;
  white-space:nowrap;
  min-width:var(--sidebar-w);
}

/* ── Main viewer ── */
.viewer{flex:1;min-width:0;position:relative;background:var(--bg-900);}
.viewer-frame{
  position:absolute;inset:0;border:none;width:100%;height:100%;
  background:var(--bg-800);
}
.viewer-loading{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  background:var(--bg-900);z-index:5;
  transition:opacity .35s var(--ease),visibility .35s;
}
.viewer-loading.hidden{opacity:0;visibility:hidden;pointer-events:none;}
.spinner{
  width:32px;height:32px;border-radius:50%;
  border:2.5px solid var(--bg-600);
  border-top-color:var(--accent);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:12px;color:var(--ink-mute);}

.viewer-empty{
  position:absolute;inset:0;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:24px;text-align:center;
}
.viewer-empty.show{display:flex;}
.empty-icon{font-size:36px;opacity:.35;}
.empty-title{font-size:15px;font-weight:600;}
.empty-sub{font-size:12px;color:var(--ink-mute);max-width:320px;line-height:1.5;}

/* ── Mobile overlay ── */
.backdrop{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);
  z-index:10;opacity:0;transition:opacity .28s var(--ease);
}
.backdrop.show{display:block;opacity:1;}

@media(max-width:768px){
  .sidebar{
    position:fixed;top:var(--topbar-h);left:0;bottom:0;
    width:var(--sidebar-w);min-width:var(--sidebar-w);
    transform:translateX(-100%);
    opacity:1;pointer-events:auto;
    box-shadow:8px 0 32px rgba(0,0,0,.4);
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar.collapsed{width:var(--sidebar-w);min-width:var(--sidebar-w);opacity:1;}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-btn" id="menuBtn" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="brand">
        <div class="brand-title">Workflow Library</div>
        <div class="brand-sub" id="activeLabel">Select a workflow to begin</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="count-badge" id="countBadge">0 workflows</span>
    </div>
  </header>

  <div class="body">
    <div class="backdrop" id="backdrop"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="sidebar-label">Canvases</div>
        <div class="sidebar-count" id="sidebarCount"></div>
      </div>
      <div class="workflow-list" id="workflowList"></div>
      <div class="sidebar-foot">Drop new HTML files into <strong>workflows/</strong> and register them in <strong>workflows.json</strong>.</div>
    </aside>

    <main class="viewer">
      <div class="viewer-loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">Loading workflow…</div>
      </div>
      <div class="viewer-empty" id="empty">
        <div class="empty-icon">◈</div>
        <div class="empty-title">No workflow selected</div>
        <div class="empty-sub">Choose a canvas from the sidebar to load an interactive workflow demo.</div>
      </div>
      <iframe class="viewer-frame" id="frame" title="Workflow canvas" hidden></iframe>
    </main>
  </div>
</div>

<script>
(function(){
  var STORAGE_COLLAPSED = 'wflib.sidebarCollapsed';
  var STORAGE_LAST = 'wflib.lastWorkflow';
  var MOBILE = window.matchMedia('(max-width:768px)');

  var workflows = [];
  var activeId = null;

  var sidebar = document.getElementById('sidebar');
  var backdrop = document.getElementById('backdrop');
  var workflowList = document.getElementById('workflowList');
  var frame = document.getElementById('frame');
  var loading = document.getElementById('loading');
  var loadingText = document.getElementById('loadingText');
  var empty = document.getElementById('empty');
  var activeLabel = document.getElementById('activeLabel');
  var countBadge = document.getElementById('countBadge');
  var sidebarCount = document.getElementById('sidebarCount');

  function isMobile(){ return MOBILE.matches; }

  function setSidebarCollapsed(collapsed){
    if(isMobile()) return;
    sidebar.classList.toggle('collapsed', collapsed);
    document.getElementById('menuBtn').setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    localStorage.setItem(STORAGE_COLLAPSED, collapsed ? '1' : '0');
  }

  function closeMobileSidebar(){
    sidebar.classList.remove('open');
    backdrop.classList.remove('show');
  }

  function toggleSidebar(){
    if(isMobile()){
      var open = sidebar.classList.toggle('open');
      backdrop.classList.toggle('show', open);
    } else {
      setSidebarCollapsed(!sidebar.classList.contains('collapsed'));
    }
  }

  function renderCards(){
    workflowList.innerHTML = '';
    workflows.forEach(function(wf){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'wf-card' + (wf.id === activeId ? ' active' : '');
      btn.dataset.id = wf.id;
      btn.innerHTML =
        '<div class="wf-card-inner">' +
          '<div class="wf-accent" style="background:' + wf.accent + '"></div>' +
          '<div class="wf-body">' +
            '<div class="wf-text">' +
              '<div class="wf-title">' + esc(wf.title) + '</div>' +
              '<div class="wf-sub">' + esc(wf.subtitle) + '</div>' +
              '<div class="wf-client">' + esc(wf.client) + '</div>' +
              (wf.tags && wf.tags.length ?
                '<div class="wf-tags">' + wf.tags.map(function(t){
                  return '<span class="wf-tag">' + esc(t) + '</span>';
                }).join('') : '') +
            '</div>' +
          '</div>' +
        '</div>';
      btn.addEventListener('click', function(){ selectWorkflow(wf.id); });
      workflowList.appendChild(btn);
    });

    countBadge.textContent = workflows.length + ' workflow' + (workflows.length === 1 ? '' : 's');
    sidebarCount.textContent = workflows.length + ' available';
  }

  function esc(s){
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function selectWorkflow(id){
    var wf = workflows.find(function(w){ return w.id === id; });
    if(!wf) return;

    activeId = id;
    localStorage.setItem(STORAGE_LAST, id);
    if(location.hash !== '#' + id) history.replaceState(null, '', '#' + id);

    renderCards();
    activeLabel.textContent = wf.title + ' · ' + wf.subtitle;
    empty.classList.remove('show');
    loading.classList.remove('hidden');
    loadingText.textContent = 'Loading ' + wf.title + '…';
    frame.hidden = false;
    frame.src = wf.file;

    if(isMobile()) closeMobileSidebar();
  }

  frame.addEventListener('load', function(){
    loading.classList.add('hidden');
  });

  function initFromHash(){
    var hash = location.hash.replace(/^#/, '');
    if(hash && workflows.some(function(w){ return w.id === hash; })){
      selectWorkflow(hash);
      return;
    }
    var last = localStorage.getItem(STORAGE_LAST);
    if(last && workflows.some(function(w){ return w.id === last; })){
      selectWorkflow(last);
      return;
    }
    if(workflows.length === 1){
      selectWorkflow(workflows[0].id);
      return;
    }
    empty.classList.add('show');
    loading.classList.add('hidden');
    frame.hidden = true;
  }

  document.getElementById('menuBtn').addEventListener('click', toggleSidebar);
  backdrop.addEventListener('click', closeMobileSidebar);

  window.addEventListener('hashchange', function(){
    var hash = location.hash.replace(/^#/, '');
    if(hash && hash !== activeId && workflows.some(function(w){ return w.id === hash; })){
      selectWorkflow(hash);
    }
  });

  MOBILE.addEventListener('change', function(){
    sidebar.classList.remove('open', 'collapsed');
    backdrop.classList.remove('show');
    if(!isMobile()){
      setSidebarCollapsed(localStorage.getItem(STORAGE_COLLAPSED) === '1');
    }
  });

  fetch('workflows.json')
    .then(function(r){ if(!r.ok) throw new Error('Failed to load registry'); return r.json(); })
    .then(function(data){
      workflows = data;
      renderCards();
      if(!isMobile()) setSidebarCollapsed(localStorage.getItem(STORAGE_COLLAPSED) === '1');
      initFromHash();
    })
    .catch(function(err){
      empty.classList.add('show');
      loading.classList.add('hidden');
      empty.querySelector('.empty-title').textContent = 'Could not load workflows';
      empty.querySelector('.empty-sub').textContent = err.message;
    });
})();
</script>
</body>
</html>
